name: Rust shadow recovery excerpt

on:
  push:
    paths:
      - 'rust-shadow-sample/**'
      - '.github/workflows/rust-shadow-sample.yml'
  pull_request:
    paths:
      - 'rust-shadow-sample/**'
      - '.github/workflows/rust-shadow-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rust-shadow-sample
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report runner toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test recovery with synthetic files
        run: cargo test --offline
      - name: Check all targets
        run: cargo clippy --offline --all-targets -- -D warnings
